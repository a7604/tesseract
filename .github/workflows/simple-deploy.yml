# 🚀 Simple CI/CD Pipeline for Tesseract Club Website
# This deploys to GitHub Pages (FREE and EASY!)

name: Deploy Website

# When should this run?
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# What should happen?
jobs:
  # Job 1: Check if your code is good
  check-code:
    name: Check Code Quality
    runs-on: ubuntu-latest
    
    steps:
      - name: Get Code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          
      - name: Install Dependencies
        run: npm ci
        
      - name: Check Code Quality
        run: npm run lint
        
      - name: Build Website
        run: npm run build
        
  # Job 2: Deploy to GitHub Pages (SUPER SIMPLE!)
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: check-code
    if: github.ref == 'refs/heads/main'  # Only deploy from main branch
    
    steps:
      - name: Get Code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          
      - name: Install Dependencies
        run: npm ci
        
      - name: Build Website
        run: npm run build
        
      # This is the magic - GitHub Pages deployment!
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist  # This is where Vite puts your built files
